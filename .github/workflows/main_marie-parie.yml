# Deploy the static Marie Parie site to Azure App Service.
# Azure authentication is configured by App Service Deployment Center using OIDC.

name: Deploy Marie Parie to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_798D32834C114C4C962E0FAD53BC95AA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FD68340C4B054DAC9968AEA4E65F8665 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EB49B3608087491CB9A62264A36B8AFC }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: marie-parie
          slot-name: Production
          package: .
