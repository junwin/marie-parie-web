# Deploy the static Marie Parie staging site to Azure App Service.
# Azure authentication is configured by App Service Deployment Center using OIDC.

name: Deploy Marie Parie Staging to Azure Web App

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC15F622775B42BC8DE917206AF5DD74 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D66EF76951BE4A4DBB0022972C2209F8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2CC1FB82CCD2400095217B97F31EDEA8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: marie-parie-staging
          slot-name: Production
          package: .
