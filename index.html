<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marie Parie Boutique</title>
  <meta name="description" content="Marie Parie Boutique">
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #f7f5f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(720px, 100%);
      padding: 4rem 2rem;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e0da;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1>Marie Parie</h1>
    <p>Boutique style, thoughtfully chosen.</p>
  </main>
</body>
</html>
